<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-translate-key="pageTitle">Калькулятор ресурсов CoI</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#3b82f6"> 
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="CoI Кальк"> 
    <link rel="apple-touch-icon" href="icon-192x192.png"> 

    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: 'Inter', sans-serif; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .tab-button.active { background-color: #3b82f6; color: white; }
        
        .table-header th { background-color: #f3f4f6; position: sticky; top: 0; z-index: 10; text-align: center;}

        input[type="number"].qty-input { width: 60px; text-align: right; padding: 0.25rem; font-size: 0.8rem;}
        input[type="text"].name-input { min-width: 120px; padding: 0.25rem; font-size: 0.8rem;}
        input[type="url"].icon-url-input { min-width: 150px; padding: 0.25rem; font-size: 0.8rem;}
        select.resource-select { min-width: 130px; padding: 0.25rem; font-size: 0.8rem;}

        .removable-row:hover .remove-btn-recipe { opacity: 1; }
        .remove-btn-recipe { opacity: 0.3; transition: opacity 0.2s; }
        .section-title { font-size: 1.25rem; font-weight: 600; margin-bottom: 0.75rem; padding-bottom: 0.4rem; border-bottom: 1px solid #e5e7eb; }
        .table-container { max-height: 65vh; overflow: auto; border: 1px solid #d1d5db; border-radius: 0.375rem; }
        table { width: 100%; border-collapse: separate; border-spacing: 0;}
        th, td { padding: 0.5rem; border: 1px solid #e5e7eb; text-align: left; font-size: 0.8rem; white-space: nowrap; }
        td input.input-sm, td select.input-sm { padding: 0.3rem 0.4rem; }
        .input-sm { padding: 0.4rem 0.6rem; font-size: 0.8rem; border-radius: 0.25rem; border: 1px solid #d1d5db;}
        .btn { padding: 0.4rem 0.8rem; border-radius: 0.375rem; font-weight: 500; transition: background-color 0.2s; cursor: pointer; font-size: 0.8rem; }
        .btn-primary { background-color: #3b82f6; color: white; } .btn-primary:hover { background-color: #2563eb; }
        .btn-danger { background-color: #ef4444; color: white; } .btn-danger:hover { background-color: #dc2626; }
        .btn-success { background-color: #22c55e; color: white; } .btn-success:hover { background-color: #16a34a; }
        .btn-secondary { background-color: #6b7280; color: white; } .btn-secondary:hover { background-color: #4b5563; }
        .btn-warning { background-color: #f59e0b; color: white; } .btn-warning:hover { background-color: #d97706; }

        .btn-xs { padding: 0.2rem 0.4rem; font-size: 0.7rem; margin-left: 0.25rem; }
        
        .text-balance-positive { color: #16a34a; }
        .text-balance-negative { color: #dc2626; font-weight: bold; } 

        #languageSelectorContainer { margin-bottom: 1rem; text-align: right; }

        .modal { display: none; position: fixed; z-index: 100; left: 0; top: 0; width: 100%; height: 100%; overflow: auto; background-color: rgba(0,0,0,0.4); }
        .modal-content { background-color: #fefefe; margin: 10% auto; padding: 20px; border: 1px solid #888; width: 80%; max-width: 600px; border-radius: 0.5rem; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .modal-header { padding-bottom: 10px; border-bottom: 1px solid #eee; font-size: 1.25rem; font-weight: 600; }
        .modal-body { padding: 15px 0; } .modal-footer { padding-top: 10px; border-top: 1px solid #eee; text-align: right; }
        .close-button { color: #aaa; float: right; font-size: 28px; font-weight: bold; }
        .close-button:hover, .close-button:focus { color: black; text-decoration: none; cursor: pointer; }
        .spinner { border: 3px solid rgba(0, 0, 0, 0.1); width: 20px; height: 20px; border-radius: 50%; border-left-color: #09f; display: inline-block; vertical-align: middle; margin-left: 6px; animation: spin 1s ease infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        .resource-slots-container { display: flex; flex-direction: row; overflow-x: auto; overflow-y: hidden; align-items: flex-start; padding: 0.25rem; border: 1px dashed #cbd5e1; min-height: 80px; max-width: 400px; }
        .resource-slot { display: flex; flex-direction: column; align-items: center; padding: 0.25rem; margin-right: 0.5rem; border: 1px solid #e2e8f0; border-radius: 0.25rem; background-color: #f8fafc; min-width: 100px; text-align: center; }
        .resource-slot img.slot-icon { max-width: 32px; max-height: 32px; margin-bottom: 0.1rem; object-fit: contain; }
        /* Removed .resource-name-display as it's no longer needed for static text */
        .resource-slot span.rate-display { font-size: 0.7rem; color: #475569; margin-top: 0.1rem; }
        .resource-slot .btn-xs { align-self: center; margin-top: 0.2rem; }
        #recipesDetailTable th, #recipesDetailTable td { vertical-align: top; }
        .resource-list-icon { max-width: 24px; max-height: 24px; margin-right: 8px; vertical-align: middle; }
        
        .divider-line-red { border-right: 3px solid red !important; }
        
        .bg-light-green { background-color: #f0fff4 !important; } 
        .bg-light-red { background-color: #fff0f0 !important; } 

    </style>
</head>
<body class="bg-gray-100 p-2 md:p-4">
    <div class="container mx-auto bg-white p-3 md:p-4 rounded-lg shadow-xl">
        <h1 class="text-2xl md:text-3xl font-bold mb-1 text-center text-blue-700" data-translate-key="mainTitle">Калькулятор ресурсов Captain of Industry</h1>
        
        <div id="languageSelectorContainer">
            <label for="languageSelector" class="mr-1 text-xs md:text-sm text-gray-700" data-translate-key="languageLabel">Язык:</label>
            <select id="languageSelector" onchange="changeLanguage(this.value)" class="input-sm text-xs md:text-sm"></select>
        </div>

        <div class="mb-4 border-b border-gray-300">
            <nav class="flex flex-wrap space-x-1" aria-label="Tabs">
                <button class="tab-button active px-3 py-1.5 md:px-4 md:py-2 font-medium text-xs md:text-sm rounded-t-lg text-gray-700 hover:bg-blue-100" onclick="openTab(event, 'recipesTab')" data-translate-key="recipesTab">Рецепты</button>
                <button class="tab-button px-3 py-1.5 md:px-4 md:py-2 font-medium text-xs md:text-sm rounded-t-lg text-gray-700 hover:bg-blue-100" onclick="openTab(event, 'balanceTab')" data-translate-key="balanceTab">Баланс</button>
                <button class="tab-button px-3 py-1.5 md:px-4 md:py-2 font-medium text-xs md:text-sm rounded-t-lg text-gray-700 hover:bg-blue-100" onclick="openTab(event, 'consumptionTab')" data-translate-key="consumptionTab">Потребление</button>
                <button class="tab-button px-3 py-1.5 md:px-4 md:py-2 font-medium text-xs md:text-sm rounded-t-lg text-gray-700 hover:bg-blue-100" onclick="openTab(event, 'productionTab')" data-translate-key="productionTab">Производство</button>
                <button class="tab-button px-3 py-1.5 md:px-4 md:py-2 font-medium text-xs md:text-sm rounded-t-lg text-gray-700 hover:bg-blue-100" onclick="openTab(event, 'resourcesTab')" data-translate-key="resourcesListTab">Ресурсы</button>
            </nav>
        </div>

        <div id="resourcesTab" class="tab-content">
            <h2 class="section-title" data-translate-key="resourcesListTitle">Список Ресурсов</h2>
            <p class="mb-2 text-xs md:text-sm text-gray-600" data-translate-key="resourcesListDescription">Добавьте сюда все ресурсы. Названия должны быть уникальными.</p>
            <div class="mb-2 grid grid-cols-1 md:grid-cols-3 gap-2 items-end">
                <input type="text" id="newResourceName" class="input-sm name-input" data-translate-key="newResourcePlaceholder" placeholder="Название нового ресурса">
                <input type="url" id="newResourceIconUrl" class="input-sm icon-url-input" data-translate-key="newResourceIconPlaceholder" placeholder="URL иконки (необязательно)">
                <button onclick="addResourceToList()" class="btn btn-primary" data-translate-key="addResourceButton">Добавить ресурс</button>
            </div>
            <div class="table-container">
                <table class="min-w-full divide-y divide-gray-200">
                    <thead class="table-header">
                        <tr>
                            <th class="w-1/2" data-translate-key="resourceNameHeader">Название Ресурса</th>
                            <th class="w-1/2" data-translate-key="resourceIconUrlHeader">URL Иконки</th>
                            <th class="w-auto text-center" data-translate-key="actionHeader">Действие</th>
                        </tr>
                    </thead>
                    <tbody id="resourceListTableBody" class="bg-white divide-y divide-gray-200"></tbody>
                </table>
            </div>
        </div>

        <div id="recipesTab" class="tab-content active">
            <h2 class="section-title" data-translate-key="recipesProductionTitle">Рецепты Производства</h2>
            <p class="mb-2 text-xs md:text-sm text-gray-600" data-translate-key="recipesDescription">Изменяйте "Кол-во зданий". Используйте кнопки `+` и `-` для управления ресурсами.</p>
            <div class="flex flex-wrap space-x-2 mb-2">
                <button onclick="addEmptyRecipeRow()" class="btn btn-primary" data-translate-key="addRecipeButton">Добавить Рецепт</button>
                <button id="suggestRecipeBtn" onclick="suggestRecipeFromSurplus()" class="btn btn-success">
                    <span data-translate-key="suggestRecipeButton">✨ Предложить рецепт</span>
                    <span id="geminiLoadingSpinner" class="spinner" style="display: none;"></span>
                </button>
                <button onclick="saveDataToFile()" class="btn btn-warning" data-translate-key="saveDataButton">💾 Сохранить данные</button>
                <label class="btn btn-secondary cursor-pointer">
                    <span data-translate-key="loadDataButton">📂 Загрузить данные</span>
                    <input type="file" id="loadFileInput" class="hidden" accept=".json" onchange="loadDataFromFile(event)">
                </label>
            </div>
            <div class="table-container">
                <table id="recipesDetailTable" class="min-w-full divide-y divide-gray-200 text-sm">
                    <thead class="table-header">
                        <tr>
                            <th class="min-w-[130px]" data-translate-key="recipeNameHeader">Рецепт/Продукт</th>
                            <th class="min-w-[120px] divider-line-red" data-translate-key="buildingHeader">Здание</th>
                            <th class="min-w-[80px]" data-translate-key="cycleTimeHeader">Время (сек)</th>
                            <th class="min-w-[80px] divider-line-red" data-translate-key="buildingCountHeader">Кол-во зданий</th>
                            <th class="min-w-[80px] bg-light-green" data-translate-key="addInputButtonFixed">Добавить Вход</th>
                            <th class="min-w-[300px] max-w-[400px] bg-light-green divider-line-red" data-translate-key="inputResourcesHeader">Входные ресурсы</th>
                            <th class="min-w-[80px] bg-light-red" data-translate-key="addOutputButtonFixed">Добавить Выход</th>
                            <th class="min-w-[300px] max-w-[400px] bg-light-red" data-translate-key="outputResourcesHeader">Выходные ресурсы</th>
                            <th class="min-w-[100px]" data-translate-key="actionsHeader">Действия</th>
                        </tr>
                    </thead>
                    <tbody id="recipesTableBody" class="bg-white divide-y divide-gray-200"></tbody>
                </table>
            </div>
        </div>
        
        <div id="balanceTab" class="tab-content">
            <h2 class="section-title" data-translate-key="resourceBalanceTitle">Баланс Ресурсов</h2>
            <div class="table-container">
                <table class="min-w-full divide-y divide-gray-200">
                    <thead class="table-header">
                        <tr>
                            <th data-translate-key="resourceNameHeader">Название Ресурса</th>
                            <th data-translate-key="totalProductionCol">Производство (ед/сек)</th>
                            <th data-translate-key="totalConsumptionCol">Потребление (ед/сек)</th>
                            <th data-translate-key="balanceCol">Баланс (ед/сек)</th>
                        </tr>
                    </thead>
                    <tbody id="balanceSummaryTableBody" class="bg-white divide-y divide-gray-200"></tbody>
                </table>
            </div>
        </div>

        <div id="consumptionTab" class="tab-content">
            <h2 class="section-title" data-translate-key="consumptionSummaryTitle">Сводка Потребления</h2>
             <div class="table-container">
                <table class="min-w-full divide-y divide-gray-200">
                    <thead class="table-header">
                        <tr>
                            <th data-translate-key="resourceNameHeader">Название Ресурса</th>
                            <th data-translate-key="totalConsumptionCol">Потребление (ед/сек)</th>
                        </tr>
                    </thead>
                    <tbody id="consumptionSummaryTableBody" class="bg-white divide-y divide-gray-200"></tbody>
                </table>
            </div>
        </div>

        <div id="productionTab" class="tab-content">
            <h2 class="section-title" data-translate-key="productionSummaryTitle">Сводка Производства</h2>
            <div class="table-container">
                <table class="min-w-full divide-y divide-gray-200">
                    <thead class="table-header">
                        <tr>
                            <th data-translate-key="resourceNameHeader">Название Ресурса</th>
                            <th data-translate-key="totalProductionCol">Производство (ед/сек)</th>
                        </tr>
                    </thead>
                    <tbody id="productionSummaryTableBody" class="bg-white divide-y divide-gray-200"></tbody>
                </table>
            </div>
        </div>
    </div>

    <div id="geminiSuggestionModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <span class="close-button" onclick="closeGeminiModal()">&times;</span>
                <h2 data-translate-key="geminiModalTitle">✨ Предложение Gemini</h2>
            </div>
            <div class="modal-body">
                <p id="geminiSuggestionText" class="text-sm mb-4"></p>
                <div id="geminiRecipeDetails" class="text-sm">
                    <strong data-translate-key="suggestedRecipeNameLabel">Название рецепта:</strong> <span id="modalRecipeName"></span><br>
                    <strong data-translate-key="suggestedBuildingLabel">Здание:</strong> <span id="modalBuildingName"></span><br>
                    <strong data-translate-key="suggestedInputsLabel">Вход:</strong> <ul id="modalInputsList" class="list-disc list-inside ml-4"></ul>
                    <strong data-translate-key="suggestedOutputsLabel">Выход:</strong> <ul id="modalOutputsList" class="list-disc list-inside ml-4"></ul>
                </div>
                 <p id="geminiErrorText" class="text-red-500 text-sm mt-2" style="display: none;"></p>
            </div>
            <div class="modal-footer">
                <button id="addSuggestedRecipeBtn" class="btn btn-primary" data-translate-key="addThisRecipeButton">Добавить рецепт</button>
                <button onclick="closeGeminiModal()" class="btn btn-secondary" data-translate-key="closeButton">Закрыть</button>
            </div>
        </div>
    </div>

