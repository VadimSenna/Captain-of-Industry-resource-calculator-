        ['ru', 'en', 'uk', 'de'].forEach(lang => {
            translations[lang].resourceNames = {};
            for (const key in defaultResourceTranslations) {
                translations[lang].resourceNames[key] = defaultResourceTranslations[key][lang];
            }
        });

        let currentLanguage = 'ru'; 
        const supportedLanguages = [ 
            { code: 'ru', name: 'Русский' }, 
            { code: 'en', name: 'English' }, 
            { code: 'uk', name: 'Українська' },
            { code: 'de', name: 'Deutsch' }
        ];

        function getTranslation(key, lang = currentLanguage) {
            const langTranslations = translations[lang] || translations['ru'];
            if (key.startsWith('resourceNames.')) {
                const resourceKey = key.substring('resourceNames.'.length);
                return langTranslations.resourceNames?.[resourceKey] || defaultResourceTranslations[resourceKey]?.['en'] || resourceKey; 
            }
             if (key.startsWith('building_') || key.startsWith('initialRecipe')) { // Handle building and recipe names
                return langTranslations[key] || translations['ru'][key] || key.replace(/building_|initialRecipe/g, '').replace(/Name$/, '').replace(/([A-Z])/g, ' $1').trim(); // Fallback for building/recipe names
            }
            return langTranslations[key] || translations['ru'][key] || key; 
        }

        function applyTranslations() {
            document.querySelectorAll('[data-translate-key]').forEach(el => {
                const key = el.dataset.translateKey;
                if (el.tagName === 'INPUT' && el.placeholder) el.placeholder = getTranslation(key);
                else if (el.tagName === 'TITLE') document.title = getTranslation(key);
                else el.textContent = getTranslation(key);
            });
            document.querySelectorAll('select.resource-dropdown').forEach(s => populateResourceDropdown(s, s.value, true));
        }
        
        function translateAndUpdateInitialResourceNames() {
            resources.forEach(res => {
                if (res.translationKey) { 
                    res.name = getTranslation('resourceNames.' + res.translationKey);
                }
            });
        }

        function loadLanguage() {
            const savedLang = localStorage.getItem('coiCalculatorLanguage');
            if (savedLang && translations[savedLang]) currentLanguage = savedLang;
            const sel = document.getElementById('languageSelector');
            sel.innerHTML = ''; 
            supportedLanguages.forEach(l => {
                const opt = document.createElement('option');
                opt.value = l.code; opt.textContent = l.name;
                if (l.code === currentLanguage) opt.selected = true;
                sel.appendChild(opt);
            });
            translateAndUpdateInitialResourceNames(); 
            applyTranslations();
        }
        function changeLanguage(langCode) {
            if (translations[langCode]) {
                currentLanguage = langCode; localStorage.setItem('coiCalculatorLanguage', langCode);
                translateAndUpdateInitialResourceNames(); 
                loadInitialRecipes(); // Re-load initial recipes with new language
                applyTranslations(); 
                renderResourceList(); 
                renderRecipesTable(); 
                updateSummariesAndBalance(); 
            }
        }
        
        let initialDefaultResourcesSetup = [
            { name: 'Железная руда', iconUrl: null, translationKey: 'ironOre' }, 
            { name: 'Уголь', iconUrl: null, translationKey: 'coal' }, 
            { name: 'Известь', iconUrl: null, translationKey: 'limestone' }, 
            { name: 'Вода', iconUrl: null, translationKey: 'water' }, 
            { name: 'Песок', iconUrl: null, translationKey: 'sand' }, 
            { name: 'Медная руда', iconUrl: null, translationKey: 'copperOre' }, 
            { name: 'Расплавленное железо', iconUrl: null, translationKey: 'moltenIron' }, 
            { name: 'Сталь', iconUrl: null, translationKey: 'steel' }, 
            { name: 'Бетон', iconUrl: null, translationKey: 'concrete' }, 
            { name: 'Стекло', iconUrl: null, translationKey: 'glass' }, 
            { name: 'Медные слитки', iconUrl: null, translationKey: 'copperIngots' }, 
            { name: 'Пар (низк.)', iconUrl: null, translationKey: 'steamLow' }, 
            { name: 'Выхлоп', iconUrl: null, translationKey: 'exhaustGas' }, 
            { name: 'Шлак', iconUrl: null, translationKey: 'slag' }
        ];
        
        let resources = JSON.parse(JSON.stringify(initialDefaultResourcesSetup)); 
        let recipes = [];
        let currentSuggestedRecipe = null; 

        document.addEventListener('DOMContentLoaded', () => {
            loadLanguage(); 
            resources.sort((a,b) => a.name.localeCompare(b.name, currentLanguage)); 
            renderResourceList(); 
            loadInitialRecipes(); 
            renderRecipesTable(); 
            updateAllCalculations(); 
            openTab(null, 'recipesTab');
            document.getElementById('addSuggestedRecipeBtn').onclick = addSuggestedRecipeToTable;
        });

        function openTab(event, tabName) {
            document.querySelectorAll('.tab-content').forEach(tc => tc.classList.remove('active'));
            document.getElementById(tabName).classList.add('active');
            document.querySelectorAll('.tab-button').forEach(tb => tb.classList.remove('active'));
            const btn = event ? event.currentTarget : document.querySelector(`.tab-button[onclick*="'${tabName}'"]`);
            if (btn) btn.classList.add('active');
        }
        function showAlert(msgKey, isError = true) {
            const msg = getTranslation(msgKey);
            const modal = document.getElementById('geminiSuggestionModal');
            if (isError && modal.style.display === 'block') {
                 document.getElementById('geminiErrorText').textContent = msg;
                 document.getElementById('geminiErrorText').style.display = 'block';
                 document.getElementById('geminiRecipeDetails').style.display = 'none';
            } else if (modal.style.display === 'block') {
                 document.getElementById('geminiSuggestionText').textContent = msg;
            } else { alert(msg); }
        }
        
        function addResourceToList(resFromSuggestion = null) {
            const nameInput = document.getElementById('newResourceName');
            const iconUrlInput = document.getElementById('newResourceIconUrl');
            const name = resFromSuggestion ? resFromSuggestion.name : nameInput.value.trim();
            const iconUrl = resFromSuggestion ? resFromSuggestion.iconUrl : iconUrlInput.value.trim() || null;

            if (name && !resources.some(r => r.name === name)) { 
                resources.push({ name, iconUrl, translationKey: null }); 
                resources.sort((a, b) => a.name.localeCompare(b.name, currentLanguage));
                renderResourceList(); 
                updateAllResourceDropdownsInRecipes();
                if (!resFromSuggestion) { nameInput.value = ''; iconUrlInput.value = '';}
                updateAllCalculations(); return true;
            } else if (resources.some(r => r.name === name) && !resFromSuggestion) {
                showAlert('alertResourceExists');
            }
            return resources.some(r => r.name === name);
        }

        function removeResourceFromList(resName) {
            if (recipes.some(r => r.inputs.some(i => i.name === resName) || r.outputs.some(o => o.name === resName))) {
                showAlert('alertResourceInUse'); return;
            }
            resources = resources.filter(r => r.name !== resName); 
            renderResourceList();
            updateAllResourceDropdownsInRecipes(); 
            updateAllCalculations();
        }

        function renderResourceList() {
            tbody = document.getElementById('resourceListTableBody'); tbody.innerHTML = '';
            const sortedResources = [...resources].sort((a,b) => a.name.localeCompare(b.name, currentLanguage));
            sortedResources.forEach(res => {
                const r = tbody.insertRow();
                const nameCell = r.insertCell();
                if (res.iconUrl) {
                    const img = document.createElement('img');
                    img.src = res.iconUrl;
                    img.alt = res.name;
                    img.classList.add('resource-list-icon');
                    img.onerror = () => { img.style.display = 'none'; }; 
                    nameCell.appendChild(img);
                }
                nameCell.appendChild(document.createTextNode(res.name));
                
                r.insertCell().textContent = res.iconUrl || '-';
                const cell = r.insertCell(); cell.classList.add('text-center');
                const btn = document.createElement('button'); btn.textContent = getTranslation('deleteButton');
                btn.classList.add('btn', 'btn-danger', 'btn-xs'); btn.onclick = () => removeResourceFromList(res.name);
                cell.appendChild(btn);
            });
        }
        function updateAllResourceDropdownsInRecipes() { 
            document.querySelectorAll('#recipesTableBody tr').forEach((rowEl, recIdx) => {
                 if (!recipes[recIdx]) return; 
                recipes[recIdx].inputs.forEach((inp, slotIdx) => {
                    const sel = rowEl.querySelector(`select[data-recipe-idx="${recIdx}"][data-type="input"][data-slot-idx="${slotIdx}"]`);
                    if (sel) populateResourceDropdown(sel, inp.name); 
                });
                recipes[recIdx].outputs.forEach((out, slotIdx) => {
                    const sel = rowEl.querySelector(`select[data-recipe-idx="${recIdx}"][data-type="output"][data-slot-idx="${slotIdx}"]`);
                    if (sel) populateResourceDropdown(sel, out.name); 
                });
            });
        }
        function populateResourceDropdown(selEl, currentVal, forceRepopulate = true) { 
            if (forceRepopulate) { 
                 selEl.innerHTML = `<option value="">${getTranslation('selectResourcePrompt')}</option>`;
                 const sortedResourcesForDropdown = [...resources].sort((a,b) => a.name.localeCompare(b.name, currentLanguage));
                 sortedResourcesForDropdown.forEach(rObj => { 
                    const opt = document.createElement('option');
                    opt.value = rObj.name; opt.textContent = rObj.name;
                    selEl.appendChild(opt);
                });
            }
            if (resources.some(r => r.name === currentVal)) selEl.value = currentVal;
            else selEl.value = ""; 
        }
        function createResourceDropdown(type, slotIdx, recIdx, currentVal = '') {
            const sel = document.createElement('select');
            sel.classList.add('resource-select', 'input-sm', 'w-full', 'mb-1');
            sel.dataset.type = type; sel.dataset.slotIdx = slotIdx; sel.dataset.recipeIdx = recIdx;
            populateResourceDropdown(sel, currentVal, true); 
            sel.onchange = (e) => handleRecipeDataChange(e.target, recIdx, type, slotIdx, 'name');
            return sel;
        }
        function createNumericInput(val, recIdx, fieldType, slotIdx = null, subField = 'qty') {
            const inp = document.createElement('input');
            inp.type = 'number'; inp.min = '0'; inp.step = 'any'; inp.value = val;
            inp.classList.add('input-sm', 'w-full', 'mb-1');
            if(fieldType === 'inputQty' || fieldType === 'outputQty') inp.classList.add('qty-input');
            inp.dataset.recipeIdx = recIdx; inp.dataset.fieldType = fieldType;
            if (slotIdx !== null) inp.dataset.slotIdx = slotIdx;
            if (subField) inp.dataset.subField = subField;
            inp.oninput = (e) => {
                let tField = fieldType;
                if (fieldType === 'inputQty' || fieldType === 'outputQty') tField = subField;
                handleRecipeDataChange(e.target, recIdx, (fieldType.startsWith('input') ? 'input' : (fieldType.startsWith('output') ? 'output' : fieldType)), slotIdx, tField);
            }
            return inp;
        }
        function handleRecipeDataChange(el, recIdx, type, slotIdx, field) {
            const val = (el.type === 'number') ? (parseFloat(el.value) || 0) : el.value;
            const rec = recipes[recIdx]; if (!rec) return;
            if (type === 'cycleTime' || type === 'buildingCount' || type === 'name' || type === 'building') {
                rec[type] = val;
            } else if (type === 'input' || type === 'output') {
                if (!rec[type + 's'][slotIdx]) rec[type + 's'][slotIdx] = {name:'', qty:0};
                rec[type + 's'][slotIdx][field] = val;
            }
            calculateRecipeRow(recIdx); updateSummariesAndBalance();
        }
        function loadInitialRecipes() {
            recipes = [
                { 
                    name: getTranslation('initialRecipeMoltenIronName'), 
                    building: getTranslation('building_smelter_1_name'), 
                    cycleTime: 60, buildingCount: 1, 
                    inputs: [
                        { name: getTranslation('resourceNames.ironOre'), qty: 36 }, 
                        { name: getTranslation('resourceNames.coal'), qty: 12}
                    ], 
                    outputs: [
                        { name: getTranslation('resourceNames.moltenIron'), qty: 12 }, 
                        { name: getTranslation('resourceNames.slag'), qty: 6 }
                    ] 
                },
                { 
                    name: getTranslation('initialRecipeSteelName'), 
                    building: getTranslation('building_converter_1_name'), 
                    cycleTime: 60, buildingCount: 1, 
                    inputs: [
                        { name: getTranslation('resourceNames.moltenIron'), qty: 24 }, 
                        { name: getTranslation('resourceNames.coal'), qty: 6 }
                    ], 
                    outputs: [
                        { name: getTranslation('resourceNames.steel'), qty: 18 }, 
                        { name: getTranslation('resourceNames.exhaustGas'), qty: 12 }
                    ] 
                }
            ];
        }
        function addEmptyRecipeRow(prefill = null) {
            const newRec = {
                name: prefill?.name || '', building: prefill?.building || '', cycleTime: prefill?.cycleTime || 60, buildingCount: prefill?.buildingCount || 1,
                inputs: prefill?.inputs && prefill.inputs.length > 0 ? prefill.inputs.map(i => ({...i})) : [{ name: '', qty: 0 }],
                outputs: prefill?.outputs && prefill.outputs.length > 0 ? prefill.outputs.map(o => ({...o})) : [{ name: '', qty: 0 }]
            };
            recipes.push(newRec); renderRecipesTable(); updateAllCalculations();
        }
        function addResourceSlot(recIdx, type) { 
            recipes[recIdx][type].push({ name: '', qty: 0 }); renderRecipesTable(); updateAllCalculations();
        }
        function removeResourceSlot(recIdx, type, slotIdx) { 
            recipes[recIdx][type].splice(slotIdx, 1);
            if (recipes[recIdx][type].length === 0) recipes[recIdx][type].push({ name: '', qty: 0 });
            renderRecipesTable(); updateAllCalculations();
        }
        function removeRecipeRow(idx) { recipes.splice(idx, 1); renderRecipesTable(); updateAllCalculations(); }

        function renderRecipesTable() {
            const tbody = document.getElementById('recipesTableBody'); tbody.innerHTML = ''; 
            recipes.forEach((rec, recIdx) => {
                const row = tbody.insertRow(); row.classList.add('removable-row');
                let cell = row.insertCell(); // Recipe Name
                const nameInp = document.createElement('input'); nameInp.type = 'text'; nameInp.value = rec.name;
                nameInp.classList.add('input-sm', 'name-input', 'w-full'); nameInp.onchange = (e) => handleRecipeDataChange(e.target, recIdx, 'name');
                cell.appendChild(nameInp);

                cell = row.insertCell(); // Building
                cell.classList.add('divider-line-red');
                const buildInp = document.createElement('input'); buildInp.type = 'text'; buildInp.value = rec.building;
                buildInp.classList.add('input-sm', 'name-input', 'w-full'); buildInp.onchange = (e) => handleRecipeDataChange(e.target, recIdx, 'building');
                cell.appendChild(buildInp);
                
                row.insertCell().appendChild(createNumericInput(rec.cycleTime, recIdx, 'cycleTime')); // Cycle Time
                
                cell = row.insertCell(); // Building Count
                cell.classList.add('divider-line-red');
                cell.appendChild(createNumericInput(rec.buildingCount, recIdx, 'buildingCount'));
                
                cell = row.insertCell(); cell.classList.add('text-center', 'align-middle', 'bg-light-green'); // Add Input Button
                const addInBtn = document.createElement('button'); addInBtn.textContent = '+';
                addInBtn.title = getTranslation('addInputButton');
                addInBtn.classList.add('btn', 'btn-success', 'btn-xs'); addInBtn.onclick = () => addResourceSlot(recIdx, 'inputs');
                cell.appendChild(addInBtn);

                cell = row.insertCell(); // Input Resources Container
                cell.classList.add('bg-light-green', 'divider-line-red');
                const inputsContainer = document.createElement('div'); inputsContainer.classList.add('resource-slots-container');
                rec.inputs.forEach((inp, i) => {
                    const slotDiv = document.createElement('div'); slotDiv.classList.add('resource-slot');
                    const resObj = resources.find(r => r.name === inp.name);
                    if (resObj && resObj.iconUrl) {
                        const img = document.createElement('img'); img.src = resObj.iconUrl; img.alt = ''; img.classList.add('slot-icon');
                        img.onerror = () => { img.style.display = 'none'; }; slotDiv.appendChild(img);
                    }
                    // Removed static name display. Dropdown itself will show selected resource name.
                    slotDiv.appendChild(createResourceDropdown('input', i, recIdx, inp.name));
                    slotDiv.appendChild(createNumericInput(inp.qty, recIdx, 'inputQty', i));
                    const rateSpan = document.createElement('span'); 
                    rateSpan.classList.add(`input-rate-${recIdx}-${i}`, 'rate-display');
                    const consRateTextFull = getTranslation('consumptionRateCol');
                    const consRateTextParts = consRateTextFull.split('('); 
                    const consUnit = consRateTextParts.length > 1 && consRateTextParts[1] ? consRateTextParts[1].replace(')', '') : consRateTextFull; 
                    rateSpan.textContent = '0.00 ' + consUnit; 
                    slotDiv.appendChild(rateSpan);
                    const remBtn = document.createElement('button'); remBtn.textContent = '-'; remBtn.title = getTranslation('deleteButton');
                    remBtn.classList.add('btn', 'btn-danger', 'btn-xs', 'mt-1'); remBtn.onclick = () => removeResourceSlot(recIdx, 'inputs', i);
                    slotDiv.appendChild(remBtn);
                    inputsContainer.appendChild(slotDiv);
                });
                cell.appendChild(inputsContainer);

                cell = row.insertCell(); cell.classList.add('text-center', 'align-middle', 'bg-light-red'); // Add Output Button
                const addOutBtn = document.createElement('button'); addOutBtn.textContent = '+';
                addOutBtn.title = getTranslation('addOutputButton');
                addOutBtn.classList.add('btn', 'btn-success', 'btn-xs'); addOutBtn.onclick = () => addResourceSlot(recIdx, 'outputs');
                cell.appendChild(addOutBtn);

                cell = row.insertCell(); // Output Resources Container
                cell.classList.add('bg-light-red');
                const outputsContainer = document.createElement('div'); outputsContainer.classList.add('resource-slots-container');
                rec.outputs.forEach((out, i) => {
                    const slotDiv = document.createElement('div'); slotDiv.classList.add('resource-slot');
                     const resObj = resources.find(r => r.name === out.name);
                    if (resObj && resObj.iconUrl) {
                        const img = document.createElement('img'); img.src = resObj.iconUrl; img.alt = ''; img.classList.add('slot-icon');
                        img.onerror = () => { img.style.display = 'none'; }; slotDiv.appendChild(img);
                    }
                    // Removed static name display
                    slotDiv.appendChild(createResourceDropdown('output', i, recIdx, out.name));
                    slotDiv.appendChild(createNumericInput(out.qty, recIdx, 'outputQty', i));
                    const rateSpan = document.createElement('span'); 
                    rateSpan.classList.add(`output-rate-${recIdx}-${i}`, 'rate-display');
                    const prodRateTextFull = getTranslation('productionRateCol');
                    const prodRateTextParts = prodRateTextFull.split('('); 
                    const prodUnit = prodRateTextParts.length > 1 && prodRateTextParts[1] ? prodRateTextParts[1].replace(')', '') : prodRateTextFull; 
                    rateSpan.textContent = '0.00 ' + prodUnit; 
                    slotDiv.appendChild(rateSpan);
                    const remBtn = document.createElement('button'); remBtn.textContent = '-'; remBtn.title = getTranslation('deleteButton');
                    remBtn.classList.add('btn', 'btn-danger', 'btn-xs', 'mt-1'); remBtn.onclick = () => removeResourceSlot(recIdx, 'outputs', i);
                    slotDiv.appendChild(remBtn);
                    outputsContainer.appendChild(slotDiv);
                });
                cell.appendChild(outputsContainer);
                
                cell = row.insertCell(); cell.classList.add('text-center', 'align-middle'); // Action Cell (Delete Recipe)
                const remRecBtn = document.createElement('button'); remRecBtn.textContent = getTranslation('removeRecipeButton');
                remRecBtn.classList.add('btn', 'btn-danger', 'btn-xs', 'remove-btn-recipe'); remRecBtn.onclick = () => removeRecipeRow(recIdx);
                cell.appendChild(remRecBtn);
            });
            updateAllResourceDropdownsInRecipes(); recipes.forEach((_,idx) => calculateRecipeRow(idx)); updateSummariesAndBalance();
        }

        function calculateRecipeRow(recIdx) {
            const rec = recipes[recIdx]; if (!rec) return;
            const cycle = rec.cycleTime || 0; const count = rec.buildingCount || 0;
            const rowEl = document.getElementById('recipesTableBody').rows[recIdx]; if (!rowEl) return;

            rec.inputs.forEach((inp, i) => {
                const rate = (cycle > 0 && inp.qty > 0 && inp.name) ? (inp.qty / cycle * count) : 0;
                const rateEl = rowEl.querySelector(`.input-rate-${recIdx}-${i}`);
                const consRateTextFull = getTranslation('consumptionRateCol');
                const consRateTextPartsCalc = consRateTextFull.split('('); 
                const consUnitCalc = consRateTextPartsCalc.length > 1 && consRateTextPartsCalc[1] ? consRateTextPartsCalc[1].replace(')','') : consRateTextFull; 
                if (rateEl) rateEl.textContent = rate.toFixed(2) + ' ' + consUnitCalc; 

                const iconEl = rateEl?.closest('.resource-slot')?.querySelector('img.slot-icon');
                if(iconEl) { 
                    const resObj = resources.find(r => r.name === inp.name);
                    if (resObj && resObj.iconUrl) { iconEl.src = resObj.iconUrl; iconEl.style.display='';} else {iconEl.style.display='none';}
                }
            });
            rec.outputs.forEach((out, i) => {
                const rate = (cycle > 0 && out.qty > 0 && out.name) ? (out.qty / cycle * count) : 0;
                const rateEl = rowEl.querySelector(`.output-rate-${recIdx}-${i}`);
                const prodRateTextFull = getTranslation('productionRateCol');
                const prodRateTextPartsCalc = prodRateTextFull.split('('); 
                const prodUnitCalc = prodRateTextPartsCalc.length > 1 && prodRateTextPartsCalc[1] ? prodRateTextPartsCalc[1].replace(')','') : prodRateTextFull; 
                if (rateEl) rateEl.textContent = rate.toFixed(2) + ' ' + prodUnitCalc; 

                const iconEl = rateEl?.closest('.resource-slot')?.querySelector('img.slot-icon');
                 if(iconEl) { 
                    const resObj = resources.find(r => r.name === out.name);
                    if (resObj && resObj.iconUrl) { iconEl.src = resObj.iconUrl; iconEl.style.display='';} else {iconEl.style.display='none';}
                }
            });
        }
        function updateAllCalculations() { recipes.forEach((_, idx) => calculateRecipeRow(idx)); updateSummariesAndBalance(); }
        function updateSummariesAndBalance() {
            const cons = {}; const prod = {}; resources.forEach(r => { cons[r.name] = 0; prod[r.name] = 0; });
            recipes.forEach(rec => {
                const cycle = rec.cycleTime || 0; const count = rec.buildingCount || 0;
                if (cycle > 0 && count > 0) {
                    rec.inputs.forEach(i => { if (i.name && i.qty > 0) cons[i.name] = (cons[i.name] || 0) + (i.qty / cycle * count); });
                    rec.outputs.forEach(o => { if (o.name && o.qty > 0) prod[o.name] = (prod[o.name] || 0) + (o.qty / cycle * count); });
                }
            });
            renderSummaryTable('consumptionSummaryTableBody', cons); renderSummaryTable('productionSummaryTableBody', prod);
            renderBalanceTable(prod, cons);
        }
        function renderSummaryTable(tbodyId, data) {
            const tbody = document.getElementById(tbodyId); tbody.innerHTML = '';
            const currentResourceNames = [...resources].sort((a,b)=>a.name.localeCompare(b.name, currentLanguage)).map(r=>r.name);
            currentResourceNames.forEach(resName => { 
                const val = data[resName] || 0;
                if (val > 0.0001 || resources.some(r=>r.name === resName)) { 
                    const r = tbody.insertRow(); 
                    const nameCell = r.insertCell();
                    const resObj = resources.find(robj => robj.name === resName);
                    if (resObj && resObj.iconUrl) {
                        const img = document.createElement('img'); img.src = resObj.iconUrl; img.alt = ''; img.classList.add('resource-list-icon');
                        img.onerror = () => { img.style.display = 'none'; }; nameCell.appendChild(img);
                    }
                    nameCell.appendChild(document.createTextNode(resName));
                    r.insertCell().textContent = val.toFixed(2);
                }
            });
        }
        function renderBalanceTable(prodData, consData) {
            const tbody = document.getElementById('balanceSummaryTableBody'); tbody.innerHTML = '';
            const currentResourceNames = [...resources].sort((a,b)=>a.name.localeCompare(b.name, currentLanguage)).map(r=>r.name);
            currentResourceNames.forEach(resName => {
                const p = prodData[resName] || 0; const c = consData[resName] || 0; const bal = p - c;
                if (resources.some(r=>r.name === resName) || p > 0.0001 || c > 0.0001) {
                    const r = tbody.insertRow(); 
                    const nameCell = r.insertCell();
                    const resObj = resources.find(robj => robj.name === resName);
                     if (resObj && resObj.iconUrl) {
                        const img = document.createElement('img'); img.src = resObj.iconUrl; img.alt = ''; img.classList.add('resource-list-icon');
                        img.onerror = () => { img.style.display = 'none'; }; nameCell.appendChild(img);
                    }
                    nameCell.appendChild(document.createTextNode(resName));
                    
                    nameCell.classList.remove('text-balance-positive', 'text-balance-negative', 'font-bold'); 
                    if (bal < -0.0001) {
                        nameCell.classList.add('text-balance-negative');
                    } else if (bal > 0.0001) {
                        nameCell.classList.add('text-balance-positive');
                    }

                    r.insertCell().textContent = p.toFixed(2); 
                    r.insertCell().textContent = c.toFixed(2);
                    const balanceCell = r.insertCell(); 
                    balanceCell.textContent = bal.toFixed(2);
                    balanceCell.classList.remove('text-balance-positive', 'text-balance-negative', 'font-bold'); 
                    if (bal < -0.0001) {
                        balanceCell.classList.add('text-balance-negative');
                    } else if (bal > 0.0001) {
                        balanceCell.classList.add('text-balance-positive');
                    }
                }
            });
        }

        const geminiModal = document.getElementById('geminiSuggestionModal');
        const geminiSpinner = document.getElementById('geminiLoadingSpinner');
        const suggestBtn = document.getElementById('suggestRecipeBtn');
        function openGeminiModal() {
            document.getElementById('geminiSuggestionText').textContent = '';
            document.getElementById('geminiErrorText').style.display = 'none';
            document.getElementById('geminiRecipeDetails').style.display = 'none';
            geminiModal.style.display = 'block';
        }
        function closeGeminiModal() { geminiModal.style.display = 'none'; currentSuggestedRecipe = null; }
        window.onclick = function(e) { if (e.target == geminiModal) closeGeminiModal(); }
        
        async function suggestRecipeFromSurplus() {
            openGeminiModal(); geminiSpinner.style.display = 'inline-block'; suggestBtn.disabled = true;
            document.getElementById('geminiSuggestionText').textContent = getTranslation('geminiLoading');
            const surplus = []; const prod = {}; const cons = {};
            resources.forEach(r => { cons[r.name] = 0; prod[r.name] = 0; });
            recipes.forEach(rec => {
                const cycle = rec.cycleTime || 0; const count = rec.buildingCount || 0;
                if (cycle > 0 && count > 0) {
                    rec.inputs.forEach(i => { if (i.name && i.qty > 0) cons[i.name] = (cons[i.name] || 0) + (i.qty / cycle * count); });
                    rec.outputs.forEach(o => { if (o.name && o.qty > 0) prod[o.name] = (prod[o.name] || 0) + (o.qty / cycle * count); });
                }
            });
            resources.forEach(rObj => { if ((prod[rObj.name] || 0) - (cons[rObj.name] || 0) > 0.1) surplus.push(rObj.name); });
            if (surplus.length === 0) {
                document.getElementById('geminiSuggestionText').textContent = ''; showAlert('geminiNoSurplus', true);
                geminiSpinner.style.display = 'none'; suggestBtn.disabled = false; return;
            }
            const prompt = `Captain of Industry game expert. Surplus resources: ${surplus.join(', ')}. Suggest one new product and simplified recipe. Format: JSON object. Recipe name, building type, up to 3 inputs (name, approx qty/cycle), up to 2 outputs (name, approx qty/cycle). Focus on common early/mid-game. Reasonable quantities for a single cycle (e.g., 60s). Standard game resource names.`;
            const apiKey = ""; 
            const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${apiKey}`;
            const payload = {
                contents: [{ role: "user", parts: [{ text: prompt }] }],
                generationConfig: {
                    responseMimeType: "application/json",
                    responseSchema: {
                        type: "OBJECT",
                        properties: {
                            "suggestedRecipeName": { "type": "STRING" }, "suggestedBuilding": { "type": "STRING" },
                            "suggestedInputs": { "type": "ARRAY", "maxItems": 3, "items": { "type": "OBJECT", "properties": { "name": { "type": "STRING" }, "qty": { "type": "NUMBER" } }, "required": ["name", "qty"] }},
                            "suggestedOutputs": { "type": "ARRAY", "maxItems": 2, "items": { "type": "OBJECT", "properties": { "name": { "type": "STRING" }, "qty": { "type": "NUMBER" } }, "required": ["name", "qty"] }}
                        }, "required": ["suggestedRecipeName", "suggestedBuilding", "suggestedInputs", "suggestedOutputs"]
                    }
                }
            };
            try {
                const resp = await fetch(apiUrl, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
                if (!resp.ok) { const errData = await resp.json(); throw new Error(`API ${resp.status}: ${errData?.error?.message || resp.statusText}`); }
                const res = await resp.json();
                if (res.candidates?.[0]?.content?.parts?.[0]) {
                    const parsed = JSON.parse(res.candidates[0].content.parts[0].text);
                    currentSuggestedRecipe = { name: parsed.suggestedRecipeName, building: parsed.suggestedBuilding, inputs: parsed.suggestedInputs.map(i => ({ name: i.name, qty: parseFloat(i.qty) || 0 })), outputs: parsed.suggestedOutputs.map(o => ({ name: o.name, qty: parseFloat(o.qty) || 0 })) };
                    currentSuggestedRecipe.inputs.forEach(i => addResourceToList({name: i.name, iconUrl: null})); 
                    currentSuggestedRecipe.outputs.forEach(o => addResourceToList({name: o.name, iconUrl: null}));
                    updateAllResourceDropdownsInRecipes(); displaySuggestedRecipe(currentSuggestedRecipe);
                } else { showAlert('geminiParseError', true); }
            } catch (err) { console.error('Gemini API Error:', err); showAlert('geminiError', true); }
            finally { geminiSpinner.style.display = 'none'; suggestBtn.disabled = false; document.getElementById('geminiSuggestionText').textContent = ''; }
        }
        function displaySuggestedRecipe(sugg) {
            document.getElementById('geminiRecipeDetails').style.display = 'block'; document.getElementById('geminiErrorText').style.display = 'none';
            document.getElementById('modalRecipeName').textContent = sugg.name; document.getElementById('modalBuildingName').textContent = sugg.building;
            const ulIn = document.getElementById('modalInputsList'); ulIn.innerHTML = ''; sugg.inputs.forEach(i => { const li = document.createElement('li'); li.textContent = `${i.name}: ${i.qty}`; ulIn.appendChild(li); });
            const ulOut = document.getElementById('modalOutputsList'); ulOut.innerHTML = ''; sugg.outputs.forEach(o => { const li = document.createElement('li'); li.textContent = `${o.name}: ${o.qty}`; ulOut.appendChild(li); });
        }
        function addSuggestedRecipeToTable() { if (currentSuggestedRecipe) { addEmptyRecipeRow(currentSuggestedRecipe); closeGeminiModal(); } }

        function saveDataToFile() {
            const saveData = {
                version: "coi_calc_v11_translation_fixes", 
                resources: resources.map(r => ({ name: r.name, iconUrl: r.iconUrl, translationKey: r.translationKey})), 
                recipes: recipes
            };
            const jsonData = JSON.stringify(saveData, null, 2); 
            const blob = new Blob([jsonData], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `coi_calculator_data_${new Date().toISOString().slice(0,10)}.json`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        function loadDataFromFile(event) {
            const file = event.target.files[0];
            if (!file) return;

            if (!confirm(getTranslation('confirmLoad'))) {
                event.target.value = null; 
                return;
            }

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const loadedData = JSON.parse(e.target.result);
                    if (loadedData && loadedData.resources && loadedData.recipes && loadedData.version) {
                        resources = loadedData.resources.map(res => {
                            let name = res.name; // Default to saved name
                            // If there's a translationKey, find the appropriate translation for the current language
                            // This ensures that if a user saved data in one language, default resources still get translated
                            // when loaded in another language. User-added resources will retain their saved names.
                            if (res.translationKey && defaultResourceTranslations[res.translationKey]) {
                                name = getTranslation('resourceNames.' + res.translationKey);
                            }
                            return { 
                                name: name, 
                                iconUrl: res.iconUrl || null,
                                translationKey: res.translationKey || null // Preserve or find translationKey
                            };
                        });
                        
                        recipes = loadedData.recipes;
                        
                        // Now, ensure that names within the loaded recipes (for default resources) are also translated
                        recipes.forEach(recipe => {
                            // Translate recipe name if it was one of the initial ones
                            const recipeNameKey = Object.keys(translations[currentLanguage]).find(key => 
                                key.startsWith('initialRecipe') && 
                                (translations['ru'][key] === recipe.name || translations['en'][key] === recipe.name || translations['uk'][key] === recipe.name || translations['de'][key] === recipe.name)
                            );
                            if(recipeNameKey) recipe.name = getTranslation(recipeNameKey);

                            // Translate building name if it was one of the initial ones
                             const buildingNameKey = Object.keys(translations[currentLanguage]).find(key =>
                                key.startsWith('building_') &&
                                (translations['ru'][key] === recipe.building || translations['en'][key] === recipe.building || translations['uk'][key] === recipe.building || translations['de'][key] === recipe.building)
                            );
                            if(buildingNameKey) recipe.building = getTranslation(buildingNameKey);


                            recipe.inputs.forEach(input => {
                                const resObj = resources.find(r => (r.translationKey && defaultResourceTranslations[r.translationKey]?.[currentLanguage] === input.name) || 
                                                                  (r.translationKey && defaultResourceTranslations[r.translationKey]?.['ru'] === input.name) || // Check against original key name if needed
                                                                  (!r.translationKey && r.name === input.name)); // For user-added resources
                                if (resObj && resObj.translationKey) {
                                    input.name = getTranslation('resourceNames.' + resObj.translationKey);
                                }
                            });
                            recipe.outputs.forEach(output => {
                                const resObj = resources.find(r => (r.translationKey && defaultResourceTranslations[r.translationKey]?.[currentLanguage] === output.name) ||
                                                                   (r.translationKey && defaultResourceTranslations[r.translationKey]?.['ru'] === output.name) ||
                                                                   (!r.translationKey && r.name === output.name));
                                if (resObj && resObj.translationKey) {
                                    output.name = getTranslation('resourceNames.' + resObj.translationKey);
                                }
                            });
                        });

                        resources.sort((a,b) => a.name.localeCompare(b.name, currentLanguage));
                        
                        renderResourceList();
                        renderRecipesTable(); 
                        updateAllCalculations(); 
                        applyTranslations(); 
                        alert(getTranslation('dataLoadedSuccessfully')); 
                    } else {
                        showAlert('invalidFileFormat', true);
                    }
                } catch (error) {
                    console.error("Error parsing loaded file:", error);
                    showAlert('fileLoadError', true);
                } finally {
                    event.target.value = null; 
                }
            };
            reader.readAsText(file);
        }
    </script>
   <script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./service-worker.js')
        .then(registration => {
          console.log('PWA ServiceWorker registration successful with scope: ', registration.scope);
        })
        .catch(error => {
          console.log('PWA ServiceWorker registration failed: ', error);
        });
    });
  }
</script>
